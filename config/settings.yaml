# Affix Phase 1 settings. Verify model names at docs.claude.com before first run.
models:
  extraction: claude-sonnet-4-5      # fact-bearing work, verified after (spec §3)
  narrative: claude-haiku-4-5        # digest blurbs only, never facts

# Approximate USD per million tokens, used for spend estimates. Update from current pricing.
pricing_per_mtok:
  claude-sonnet-4-5: {input: 3.00, output: 15.00}
  claude-haiku-4-5: {input: 1.00, output: 5.00}

budget:
  monthly_cap_usd: 25.00
  alert_thresholds: [0.8, 1.0]       # alert Bri at 80%, abort at 100%

sending:
  sending_enabled: false             # master switch for subscriber sends. Also: touch state/KILL stops ALL email.
  send_day: monday
  send_time: "07:00"
  timezone: America/New_York

digest:
  max_grants_per_digest: 5

requests:
  stale_after_hours: 36

taxonomy_version: 1
